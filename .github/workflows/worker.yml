name: Worker Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'services/workers/**'
      - 'services/common/**'
      - 'lambdas/processor/**'
      - 'infra/**'
      - 'requirements.txt'
      - 'package.json'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'services/workers/**'
      - 'services/common/**'
      - 'lambdas/processor/**'
      - 'infra/**'
      - 'requirements.txt'
      - 'package.json'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and publish worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image-uri: ${{ steps.tag.outputs.image-uri }}
      image-tag: ${{ steps.tag.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tag
        id: tag
        run: |
          IMAGE_TAG=${GITHUB_SHA::12}
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ secrets.WORKER_ECR_REPOSITORY }}:$IMAGE_TAG"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build worker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f services/workers/graph/Dockerfile \
            -t ${{ steps.tag.outputs.image-uri }} \
            .

      - name: Push worker image
        run: docker push ${{ steps.tag.outputs.image-uri }}

      - name: Worker image summary
        if: always()
        uses: actions/github-script@v7
        env:
          IMAGE_URI: ${{ steps.tag.outputs.image-uri }}
        with:
          script: |
            await core.summary
              .addHeading('Worker image build')
              .addRaw(`Published image: ${process.env.IMAGE_URI}\n`, true)
              .write({ append: true });

  deploy:
    name: Deploy worker infrastructure
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '18'
      WORKER_IMAGE_TAG_PARAMETER: ${{ secrets.WORKER_IMAGE_TAG_PARAMETER }}
      WORKER_ECR_REPOSITORY: ${{ secrets.WORKER_ECR_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update worker image tag parameter
        run: |
          aws ssm put-parameter \
            --name "${{ secrets.WORKER_IMAGE_TAG_PARAMETER }}" \
            --type String \
            --overwrite \
            --value "${{ needs.build.outputs.image-tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci
          npm run build

      - name: Deploy core infrastructure
        run: npx cdk deploy MetricFoundry-Core --require-approval never

      - name: Deployment summary
        if: always()
        uses: actions/github-script@v7
        env:
          IMAGE_URI: ${{ needs.build.outputs.image-uri }}
          PARAMETER: ${{ env.WORKER_IMAGE_TAG_PARAMETER }}
        with:
          script: |
            await core.summary
              .addHeading('Worker deployment')
              .addRaw(`Image: ${process.env.IMAGE_URI}\n`, true)
              .addRaw(`SSM parameter: ${process.env.PARAMETER}\n`, true)
              .addRaw('Stack: MetricFoundry-Core\n', true)
              .write({ append: true });

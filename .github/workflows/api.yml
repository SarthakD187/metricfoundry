name: API CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'lambdas/**'
      - 'services/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'lambdas/**'
      - 'services/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  quality:
    name: Lint, test, and synth
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '18'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-cov

      - name: Install Node dependencies
        run: npm ci

      - name: Type check infrastructure
        run: npm run build

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
          ALLOW_ANONYMOUS_JOB_CREATION: 'true'
        run: |
          pytest tests --maxfail=1 --cov=services --cov-report=xml

      - name: Upload coverage report
        id: coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: coverage.xml
          if-no-files-found: error

      - name: CDK synth
        run: npx cdk synth

      - name: Quality summary
        if: always()
        uses: actions/github-script@v7
        env:
          COVERAGE_ARTIFACT_ID: ${{ steps.coverage.outputs.artifact-id || '' }}
        with:
          script: |
            const { COVERAGE_ARTIFACT_ID } = process.env;
            let coverageLink = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (COVERAGE_ARTIFACT_ID) {
              const artifact = await github.rest.actions.getArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: Number(COVERAGE_ARTIFACT_ID),
              });
              coverageLink = artifact.data.archive_download_url;
            }
            await core.summary
              .addHeading('API quality checks')
              .addList([
                `Node ${process.env.NODE_VERSION} build`,
                `Pytest + coverage`,
                `CDK synth`,
              ])
              .addLink('Download coverage report', coverageLink)
              .write({ append: true });

  deploy:
    name: Deploy API stacks
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '18'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci
          npm run build

      - name: Deploy API infrastructure
        run: |
          npx cdk deploy MetricFoundry-Auth MetricFoundry-Api --require-approval never

      - name: Collect API endpoint
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name MetricFoundry-Api \
            --query "Stacks[0].Outputs[?contains(OutputKey, 'HttpApiUrl')].OutputValue" \
            --output text || true)
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Upload CDK artifacts
        if: always()
        id: cdk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: cdk.out
          if-no-files-found: warn

      - name: Deployment summary
        if: always()
        uses: actions/github-script@v7
        env:
          API_URL: ${{ steps.api.outputs.url || '' }}
          CDK_ARTIFACT_ID: ${{ steps.cdk_artifact.outputs.artifact-id || '' }}
        with:
          script: |
            const lines = [
              'Stacks deployed: MetricFoundry-Auth, MetricFoundry-Api',
            ];
            if (process.env.API_URL && process.env.API_URL !== 'None') {
              lines.push(`API endpoint: ${process.env.API_URL}`);
            }
            let artifactLink;
            if (process.env.CDK_ARTIFACT_ID) {
              const artifact = await github.rest.actions.getArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: Number(process.env.CDK_ARTIFACT_ID),
              });
              artifactLink = artifact.data.archive_download_url;
            }
            const summary = core.summary.addHeading('API deployment');
            lines.forEach(line => summary.addRaw(`${line}\n`, true));
            if (artifactLink) {
              summary.addLink('CDK synth output', artifactLink);
            }
            await summary.write({ append: true });
